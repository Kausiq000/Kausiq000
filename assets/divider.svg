      <stop offset="25%" stop-color="#2A2A2A" stop-opacity="0.6"/>
      <stop offset="48%" stop-color="#E50914" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF2A3A" stop-opacity="1"/>
