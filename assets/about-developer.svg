  <!-- Stream Column 1 (Left) -->
  <g font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#E50914" opacity="0.45">
    <text x="28" y="70">import torch</text>
    <text x="28" y="86">import torch.nn as nn</text>
    <text x="28" y="102">from transformers import AutoModel</text>
    <text x="28" y="118">def model_predict(inputs):</text>
    <text x="38" y="134">tokens = tokenizer(inputs)</text>
    <text x="38" y="150">with torch.no_grad():</text>
    <text x="48" y="166">logits = model(**tokens)</text>
    <text x="38" y="182">return logits.argmax(-1)</text>
    <text x="28" y="200"># [TENSOR]: shape=[1, 768]</text>
    <text x="28" y="216">loss = criterion(logits, y)</text>
    <text x="28" y="232">loss.backward()</text>
    <text x="28" y="248">optimizer.step()</text>
  </g>

