    <text x="445" y="70">import cv2</text>
    <text x="445" y="86">cap = cv2.VideoCapture(0)</text>
    <text x="445" y="102">ret, frame = cap.read()</text>
    <text x="445" y="118">gray = cv2.cvtColor(frame)</text>
    <text x="445" y="134">class AIModel(nn.Module):</text>
    <text x="455" y="150">self.attn = MultiheadAttention()</text>
    <text x="455" y="166">self.fc = nn.Linear(512, 10)</text>
    <text x="445" y="184">SELECT * FROM embeddings</text>
    <text x="445" y="200">WHERE cosine_sim &gt; 0.85</text>
    <text x="445" y="216">LLM.generate(prompt=ctx)</text>
    <text x="445" y="232">git commit -m "edge-ai"</text>
    <text x="445" y="248">[INFERENCE]: 14ms (OPTIMIZED)</text>
