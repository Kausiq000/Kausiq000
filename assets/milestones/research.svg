<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030303"/>
      <stop offset="40%" stop-color="#0C0406"/>
      <stop offset="70%" stop-color="#1A0508"/>
      <stop offset="100%" stop-color="#050203"/>
    </linearGradient>

    <!-- Radial Research Glow -->
    <radialGradient id="resGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1A24" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#E50914" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Scientific Graph Grid Pattern -->
    <pattern id="resGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#4A080D" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="0" cy="0" r="0.6" fill="#E50914" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="436" height="156" rx="6" fill="url(#resBg)"/>
  <rect x="2" y="2" width="436" height="156" rx="6" fill="url(#resGrid)"/>

  <!-- Subtle Center Radial Glow -->
  <ellipse cx="220" cy="80" rx="140" ry="70" fill="url(#resGlow)"/>

  <!-- Background Watermark Emblem: Faint Research Book / Scientific Network Nodes -->
  <g transform="translate(300, 20)" opacity="0.08" stroke="#E50914" fill="none" stroke-width="2.5">
    <!-- Open Journal Book -->
    <path d="M 55 30 C 35 25, 15 28, 10 32 L 10 95 C 15 90, 35 88, 55 92 C 75 88, 95 90, 100 95 L 100 32 C 95 28, 75 25, 55 30 Z"/>
    <line x1="55" y1="30" x2="55" y2="92"/>
    <!-- Scientific Graph Nodes -->
    <circle cx="30" cy="50" r="4" fill="#E50914"/>
    <circle cx="45" cy="70" r="4" fill="#E50914"/>
    <line x1="30" y1="50" x2="45" y2="70"/>
    <circle cx="70" cy="55" r="4" fill="#E50914"/>
    <circle cx="85" cy="75" r="4" fill="#E50914"/>
    <line x1="70" y1="55" x2="85" y2="75"/>
  </g>

  <!-- Multi-Layer Technical Borders -->
  <rect x="5" y="5" width="430" height="150" rx="5" fill="none" stroke="#5A080D" stroke-opacity="0.4" stroke-width="2.5"/>
  <rect x="6" y="6" width="428" height="148" rx="4" fill="none" stroke="#E50914" stroke-opacity="0.8" stroke-width="1.2"/>
  <rect x="10" y="10" width="420" height="140" rx="3" fill="none" stroke="#250508" stroke-width="0.8"/>

  <!-- Precision Corner Reticles -->
  <path d="M 16 26 L 16 16 L 26 16" stroke="#FF1A24" stroke-width="1.8" fill="none"/>
  <circle cx="16" cy="16" r="2" fill="#FFFFFF"/>
  <path d="M 424 26 L 424 16 L 414 16" stroke="#FF1A24" stroke-width="1.8" fill="none"/>
  <circle cx="424" cy="16" r="2" fill="#FFFFFF"/>
  <path d="M 16 134 L 16 144 L 26 144" stroke="#FF1A24" stroke-width="1.8" fill="none"/>
  <circle cx="16" cy="144" r="2" fill="#FFFFFF"/>
  <path d="M 424 134 L 424 144 L 414 144" stroke="#FF1A24" stroke-width="1.8" fill="none"/>
  <circle cx="424" cy="144" r="2" fill="#FFFFFF"/>

  <!-- Index & Category -->
  <text x="24" y="32" font-family="'SF Mono', 'Consolas', monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#E50914">
    03 // PEER-REVIEWED PUBLICATION
  </text>

  <!-- Large Illuminated Research Journal Icon Container -->
  <g transform="translate(24, 46)">
    <!-- Container Badge -->
    <rect x="0" y="0" width="46" height="46" rx="23" fill="#140507" stroke="#FF1A24" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="28" fill="url(#resGlow)" opacity="0.6"/>
    <!-- Research Journal Book Icon in Pure White -->
    <path d="M 14 16 C 18 14, 21 15, 23 16 C 25 15, 28 14, 32 16 L 32 32 C 28 30, 25 31, 23 32 C 21 31, 18 30, 14 32 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="23" y1="16" x2="23" y2="32" stroke="#FFFFFF" stroke-width="1.6"/>
    <!-- Small bookmark / citation marker -->
    <path d="M 18 19 L 21 19" stroke="#FF1A24" stroke-width="1.2"/>
    <path d="M 25 19 L 28 19" stroke="#FF1A24" stroke-width="1.2"/>
    <path d="M 17 24 L 21 24" stroke="#D1D5DB" stroke-width="1"/>
    <path d="M 25 24 L 29 24" stroke="#D1D5DB" stroke-width="1"/>
  </g>

  <!-- Main Card Typography -->
  <text x="82" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="1" fill="#FFFFFF">
    RESEARCH PUBLICATION
  </text>

  <g transform="translate(82, 74)">
    <!-- Pill Capsule Badge for Status -->
    <rect x="0" y="0" width="168" height="20" rx="10" fill="#1C0508" stroke="#E50914" stroke-width="1"/>
    <circle cx="10" cy="10" r="3" fill="#FF1A24"/>
    <text x="20" y="13.5" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1" fill="#F3F4F6">
      PUBLISHED • 2026
    </text>
  </g>

  <!-- Bottom Details / Tech Subtext -->
  <line x1="24" y1="120" x2="416" y2="120" stroke="#3A080D" stroke-width="1"/>
  <text x="24" y="138" font-family="'SF Mono', 'Consolas', monospace" font-size="8" font-weight="700" fill="#9CA3AF">
    <tspan fill="#FF1A24">JOURNAL // </tspan> FMDB TRANSACTIONS ON SUSTAINABLE BIOMEDICAL ENG.
  </text>
</svg>
