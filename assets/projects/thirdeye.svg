<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgThirdEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080B"/>
      <stop offset="60%" stop-color="#0E0B10"/>
      <stop offset="100%" stop-color="#14070A"/>
    </linearGradient>
    <radialGradient id="glowThirdEye" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridTE" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#25282D" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="956" height="126" rx="6" fill="url(#bgThirdEye)"/>
  <rect x="2" y="2" width="956" height="126" rx="6" fill="url(#gridTE)"/>
  <rect x="2" y="2" width="956" height="126" rx="6" fill="url(#glowThirdEye)"/>
  <rect x="2" y="2" width="956" height="126" rx="6" fill="none" stroke="#25282D" stroke-width="1"/>
  <path d="M 2 2 L 6 2 L 6 128 L 2 128 Z" fill="#E50914"/>

  <!-- Left: Project Identity -->
  <text x="32" y="38" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#E50914">
    01 // FLAGSHIP SPOTLIGHT &#160;|&#160; ASSISTIVE AI
  </text>
  <text x="32" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="4" fill="#FFFFFF">
    THIRDEYE
  </text>
  <text x="32" y="104" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10.5" letter-spacing="1.5" fill="#9CA3AF">
    MULTIMODAL EDGE AI WEARABLE FOR VISUALLY IMPAIRED USERS
  </text>

  <!-- Right: Computer Vision & Neural Network Reticle -->
  <g transform="translate(680, 15)">
    <!-- Targeting Crosshairs -->
    <circle cx="130" cy="50" r="42" fill="none" stroke="#E50914" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="130" cy="50" r="28" fill="none" stroke="#E50914" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="80" y1="50" x2="180" y2="50" stroke="#E50914" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="130" y1="5" x2="130" y2="95" stroke="#E50914" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Corner Target Brackets -->
    <path d="M 95 25 L 95 18 L 105 18" stroke="#E50914" stroke-width="1.5" fill="none"/>
    <path d="M 165 25 L 165 18 L 155 18" stroke="#E50914" stroke-width="1.5" fill="none"/>
    <path d="M 95 75 L 95 82 L 105 82" stroke="#E50914" stroke-width="1.5" fill="none"/>
    <path d="M 165 75 L 165 82 L 155 82" stroke="#E50914" stroke-width="1.5" fill="none"/>

    <!-- Neural Stream Nodes -->
    <circle cx="30" cy="25" r="4" fill="#141416" stroke="#E50914" stroke-width="1.2"/>
    <circle cx="30" cy="50" r="5" fill="#E50914"/>
    <circle cx="30" cy="75" r="4" fill="#141416" stroke="#E50914" stroke-width="1.2"/>

    <line x1="34" y1="50" x2="70" y2="35" stroke="#E50914" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="34" y1="50" x2="70" y2="65" stroke="#E50914" stroke-opacity="0.6" stroke-width="1"/>

    <circle cx="70" cy="35" r="4" fill="#FF1A24"/>
    <circle cx="70" cy="65" r="4" fill="#FF1A24"/>

    <line x1="74" y1="35" x2="130" y2="50" stroke="#FF1A24" stroke-opacity="0.8" stroke-width="1.2"/>
    <line x1="74" y1="65" x2="130" y2="50" stroke="#FF1A24" stroke-opacity="0.8" stroke-width="1.2"/>

    <!-- Center Perception Core -->
    <circle cx="130" cy="50" r="7" fill="#FFFFFF"/>
    <circle cx="130" cy="50" r="11" fill="none" stroke="#FF1A24" stroke-width="1.5"/>

    <text x="210" y="45" font-family="'SF Mono', 'Consolas', monospace" font-size="8.5" fill="#E50914">AI_PERCEPTION</text>
    <text x="210" y="60" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#9CA3AF">STATUS: ONLINE</text>
  </g>
</svg>
