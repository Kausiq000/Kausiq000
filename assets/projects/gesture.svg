<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGesture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080B"/>
      <stop offset="100%" stop-color="#11090C"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="536" height="86" rx="6" fill="url(#bgGesture)" stroke="#25282D" stroke-width="1"/>
  <path d="M 2 2 L 5 2 L 5 88 L 2 88 Z" fill="#E50914"/>

  <!-- Left: Titles -->
  <text x="24" y="32" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="700" letter-spacing="2" fill="#E50914">
    06 // HCI / COMPUTER VISION
  </text>
  <text x="24" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="2" fill="#FFFFFF">
    HAND GESTURE CONTROL
  </text>
  <text x="24" y="76" font-family="'SF Mono', 'Consolas', monospace" font-size="9" fill="#9CA3AF">
    MEDIAPIPE SKELETAL TRACKING &#160;•&#160; OPENCV
  </text>

  <!-- Right: 21-point Hand Landmark Skeletal Graphic -->
  <g transform="translate(415, 12)">
    <!-- Palm wrist base -->
    <circle cx="50" cy="62" r="3.5" fill="#E50914"/>
    <circle cx="36" cy="50" r="3" fill="#E50914"/>
    <circle cx="64" cy="48" r="3" fill="#E50914"/>

    <!-- Thumb ray -->
    <circle cx="20" cy="38" r="2.5" fill="#FF1A24"/>
    <circle cx="12" cy="26" r="3" fill="#FFFFFF"/>
    <line x1="36" y1="50" x2="20" y2="38" stroke="#E50914" stroke-width="1.2"/>
    <line x1="20" y1="38" x2="12" y2="26" stroke="#E50914" stroke-width="1.2"/>

    <!-- Index ray -->
    <circle cx="35" cy="30" r="2.5" fill="#FF1A24"/>
    <circle cx="32" cy="14" r="3" fill="#FFFFFF"/>
    <line x1="50" y1="62" x2="35" y2="30" stroke="#E50914" stroke-width="1.2"/>
    <line x1="35" y1="30" x2="32" y2="14" stroke="#E50914" stroke-width="1.2"/>

    <!-- Middle ray -->
    <circle cx="50" cy="26" r="2.5" fill="#FF1A24"/>
    <circle cx="50" cy="8" r="3" fill="#FFFFFF"/>
    <line x1="50" y1="62" x2="50" y2="26" stroke="#E50914" stroke-width="1.2"/>
    <line x1="50" y1="26" x2="50" y2="8" stroke="#E50914" stroke-width="1.2"/>

    <!-- Ring ray -->
    <circle cx="65" cy="28" r="2.5" fill="#FF1A24"/>
    <circle cx="68" cy="14" r="3" fill="#FFFFFF"/>
    <line x1="64" y1="48" x2="65" y2="28" stroke="#E50914" stroke-width="1.2"/>
    <line x1="65" y1="28" x2="68" y2="14" stroke="#E50914" stroke-width="1.2"/>

    <!-- Pinky ray -->
    <circle cx="78" cy="36" r="2.5" fill="#FF1A24"/>
    <circle cx="85" cy="25" r="3" fill="#FFFFFF"/>
    <line x1="64" y1="48" x2="78" y2="36" stroke="#E50914" stroke-width="1.2"/>
    <line x1="78" y1="36" x2="85" y2="25" stroke="#E50914" stroke-width="1.2"/>

    <text x="50" y="74" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="7" fill="#9CA3AF">21_KEYPOINTS</text>
  </g>
</svg>
