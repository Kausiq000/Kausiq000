      <stop offset="100%" stop-color="#11090C"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="536" height="86" rx="6" fill="url(#bgCurrency)" stroke="#25282D" stroke-width="1"/>
  <path d="M 2 2 L 5 2 L 5 88 L 2 88 Z" fill="#E50914"/>

  <!-- Left: Titles -->
