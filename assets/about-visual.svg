<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#0F080A"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A3A" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#E50914" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252528" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="596" height="236" rx="8" fill="url(#cardGrad)" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="2" y="2" width="596" height="236" rx="8" fill="url(#dotGrid)"/>

  <!-- Left Side: Terminal Stream -->
  <g transform="translate(24, 30)">
    <text x="0" y="0" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="700" fill="#E50914">
      // NEURAL_INFERENCE_PIPELINE
    </text>
    <text x="0" y="24" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9.5" fill="#9CA3AF">
      &gt; SENSOR_STREAM: MULTIMODAL_INPUT
    </text>
    <text x="0" y="44" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9.5" fill="#9CA3AF">
      &gt; VISION_FEED: OPENCV_REALTIME
    </text>
    <text x="0" y="64" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9.5" fill="#9CA3AF">
      &gt; CONTEXT_WINDOW: 128K_TOKENS
    </text>
    <text x="0" y="84" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9.5" fill="#9CA3AF">
      &gt; REASONING_CORE: ACTIVE
    </text>
    <text x="0" y="104" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9.5" fill="#9CA3AF">
      &gt; LATENCY: &lt; 14ms (EDGE_OPTIMIZED)
    </text>
    <text x="0" y="130" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="700" fill="#22C55E">
      ● SYSTEM_STATUS: OPERATIONAL
    </text>
  </g>

  <!-- Vertical Divider inside graphic -->
  <line x1="280" y1="20" x2="280" y2="220" stroke="#1F2937" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Right Side: Neural Network Graph -->
  <g transform="translate(310, 20)">
    <!-- Layer 1: Input Nodes -->
    <line x1="20" y1="40" x2="110" y2="30" stroke="#E50914" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="20" y1="40" x2="110" y2="80" stroke="#E50914" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="20" y1="40" x2="110" y2="130" stroke="#E50914" stroke-opacity="0.2" stroke-width="1"/>

    <line x1="20" y1="90" x2="110" y2="30" stroke="#E50914" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="20" y1="90" x2="110" y2="80" stroke="#E50914" stroke-opacity="0.8" stroke-width="1.5"/>
    <line x1="20" y1="90" x2="110" y2="130" stroke="#E50914" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="20" y1="90" x2="110" y2="170" stroke="#E50914" stroke-opacity="0.3" stroke-width="1"/>

    <line x1="20" y1="140" x2="110" y2="80" stroke="#E50914" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="20" y1="140" x2="110" y2="130" stroke="#E50914" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="20" y1="140" x2="110" y2="170" stroke="#E50914" stroke-opacity="0.7" stroke-width="1.2"/>

    <!-- Layer 2 to Layer 3 (Output) -->
    <line x1="110" y1="30" x2="210" y2="100" stroke="#E50914" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="110" y1="80" x2="210" y2="100" stroke="#FF2A3A" stroke-opacity="0.9" stroke-width="1.8"/>
    <line x1="110" y1="130" x2="210" y2="100" stroke="#E50914" stroke-opacity="0.7" stroke-width="1.4"/>
    <line x1="110" y1="170" x2="210" y2="100" stroke="#E50914" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Layer 1 Nodes -->
    <circle cx="20" cy="40" r="5" fill="#141416" stroke="#E50914" stroke-width="1.5"/>
    <circle cx="20" cy="90" r="6" fill="#E50914"/>
    <circle cx="20" cy="140" r="5" fill="#141416" stroke="#E50914" stroke-width="1.5"/>

    <!-- Layer 2 Hidden Nodes -->
    <circle cx="110" cy="30" r="5" fill="#141416" stroke="#E50914" stroke-width="1.5"/>
    <circle cx="110" cy="80" r="7" fill="#FF2A3A"/>
    <circle cx="110" cy="130" r="6" fill="#E50914"/>
    <circle cx="110" cy="170" r="5" fill="#141416" stroke="#E50914" stroke-width="1.5"/>

    <!-- Layer 3 Output Node (Glowing) -->
    <circle cx="210" cy="100" r="24" fill="url(#nodeGlow)"/>
    <circle cx="210" cy="100" r="8" fill="#FFFFFF"/>
    <circle cx="210" cy="100" r="11" fill="none" stroke="#FF2A3A" stroke-width="1.5"/>

    <!-- Labels below network -->
    <text x="20" y="195" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#6B7280">INPUT</text>
    <text x="110" y="195" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#6B7280">HIDDEN</text>
    <text x="210" y="195" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#E50914">OUTPUT</text>
  </g>
</svg>
