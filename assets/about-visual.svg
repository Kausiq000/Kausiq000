<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060709"/>
      <stop offset="60%" stop-color="#0C0D12"/>
      <stop offset="100%" stop-color="#14080B"/>
    </linearGradient>
    <radialGradient id="nodeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1A24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E50914" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid2" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#25282D" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="596" height="246" rx="8" fill="url(#cardGrad2)" stroke="#25282D" stroke-width="1"/>
  <rect x="2" y="2" width="596" height="246" rx="8" fill="url(#dotGrid2)"/>

  <!-- Header Strip inside SVG -->
  <rect x="2" y="2" width="596" height="32" rx="8" fill="#101217" stroke="#25282D" stroke-width="0.8"/>
  <text x="20" y="22" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#E50914">
    AI SYSTEM // ACTIVE ARCHITECTURE
  </text>
  <circle cx="530" cy="18" r="3" fill="#22C55E"/>
  <text x="540" y="21" font-family="'SF Mono', 'Consolas', monospace" font-size="8.5" fill="#9CA3AF">ONLINE</text>

  <!-- 4-Stage Horizontal Pipeline Flow -->
  <!-- STAGE 1: INPUT -->
  <g transform="translate(18, 48)">
    <rect x="0" y="0" width="125" height="180" rx="6" fill="#0C0D12" stroke="#25282D" stroke-width="1"/>
    <text x="14" y="24" font-family="'SF Mono', 'Consolas', monospace" font-size="9" font-weight="700" fill="#E50914">01 // INPUT</text>
    <text x="14" y="44" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Vision Stream</text>
    <text x="14" y="60" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Multimodal Data</text>
    <text x="14" y="76" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Prompt Context</text>

    <!-- Visual telemetry bars -->
    <rect x="14" y="100" width="95" height="4" rx="2" fill="#1C1E24"/>
    <rect x="14" y="100" width="70" height="4" rx="2" fill="#E50914"/>
    <rect x="14" y="112" width="95" height="4" rx="2" fill="#1C1E24"/>
    <rect x="14" y="112" width="85" height="4" rx="2" fill="#E50914"/>
    <text x="14" y="145" font-family="'SF Mono', 'Consolas', monospace" font-size="7.5" fill="#6B7280">SENSOR_RATE: 60FPS</text>
    <text x="14" y="160" font-family="'SF Mono', 'Consolas', monospace" font-size="7.5" fill="#6B7280">TOKENS: 128K</text>
  </g>

  <!-- Flow Vector 1 -> 2 -->
  <path d="M 147 138 L 160 138" stroke="#E50914" stroke-width="1.8" fill="none"/>
  <polygon points="163,138 157,135 157,141" fill="#E50914"/>

  <!-- STAGE 2: MODELS -->
  <g transform="translate(166, 48)">
    <rect x="0" y="0" width="125" height="180" rx="6" fill="#0C0D12" stroke="#25282D" stroke-width="1"/>
    <text x="14" y="24" font-family="'SF Mono', 'Consolas', monospace" font-size="9" font-weight="700" fill="#E50914">02 // MODELS</text>
    <text x="14" y="44" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; LLMs &amp; Agents</text>
    <text x="14" y="60" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Generative AI</text>
    <text x="14" y="76" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; OpenCV Vision</text>
    <text x="14" y="92" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; NLP Pipelines</text>

    <!-- Mini Neural Nodes inside model box -->
    <circle cx="35" cy="130" r="3.5" fill="#E50914"/>
    <circle cx="35" cy="155" r="3.5" fill="#E50914"/>
    <circle cx="85" cy="142" r="4.5" fill="#FF1A24"/>
    <line x1="38" y1="130" x2="82" y2="142" stroke="#E50914" stroke-width="1"/>
    <line x1="38" y1="155" x2="82" y2="142" stroke="#E50914" stroke-width="1"/>
  </g>

  <!-- Flow Vector 2 -> 3 -->
  <path d="M 295 138 L 308 138" stroke="#E50914" stroke-width="1.8" fill="none"/>
  <polygon points="311,138 305,135 305,141" fill="#E50914"/>

  <!-- STAGE 3: PROCESSING -->
  <g transform="translate(314, 48)">
    <rect x="0" y="0" width="125" height="180" rx="6" fill="#0C0D12" stroke="#25282D" stroke-width="1"/>
    <text x="14" y="24" font-family="'SF Mono', 'Consolas', monospace" font-size="9" font-weight="700" fill="#E50914">03 // PROCESSING</text>
    <text x="14" y="44" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Embeddings</text>
    <text x="14" y="60" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Feature Vectors</text>
    <text x="14" y="76" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Edge Inference</text>

    <!-- Matrix convolution matrix -->
    <rect x="25" y="105" width="75" height="50" rx="3" fill="#141418" stroke="#E50914" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="50" y1="105" x2="50" y2="155" stroke="#25282D" stroke-width="1"/>
    <line x1="75" y1="105" x2="75" y2="155" stroke="#25282D" stroke-width="1"/>
    <line x1="25" y1="130" x2="100" y2="130" stroke="#25282D" stroke-width="1"/>
    <circle cx="62.5" cy="130" r="3" fill="#FF1A24"/>
    <text x="25" y="170" font-family="'SF Mono', 'Consolas', monospace" font-size="7.5" fill="#6B7280">LATENCY: &lt;14MS</text>
  </g>

  <!-- Flow Vector 3 -> 4 -->
  <path d="M 443 138 L 456 138" stroke="#E50914" stroke-width="1.8" fill="none"/>
  <polygon points="459,138 453,135 453,141" fill="#E50914"/>

  <!-- STAGE 4: OUTPUT -->
  <g transform="translate(462, 48)">
    <rect x="0" y="0" width="120" height="180" rx="6" fill="#0C0D12" stroke="#25282D" stroke-width="1"/>
    <text x="12" y="24" font-family="'SF Mono', 'Consolas', monospace" font-size="9" font-weight="700" fill="#E50914">04 // OUTPUT</text>
    <text x="12" y="44" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Assistive Perception</text>
    <text x="12" y="60" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Decision Logic</text>
    <text x="12" y="76" font-family="'SF Mono', 'Consolas', monospace" font-size="8" fill="#FFFFFF">&#8226; Intelligent UI/UX</text>

    <!-- Glowing output pulse -->
    <circle cx="60" cy="130" r="22" fill="url(#nodeGlow2)"/>
    <circle cx="60" cy="130" r="7" fill="#FFFFFF"/>
    <circle cx="60" cy="130" r="10" fill="none" stroke="#FF1A24" stroke-width="1.5"/>
    <text x="60" y="165" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="7.5" fill="#E50914">TARGET_ACQUIRED</text>
  </g>
</svg>
