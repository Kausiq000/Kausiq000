<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="50%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Cinematic Crimson Glow -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E50914" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF3344" stop-opacity="1"/>
      <stop offset="75%" stop-color="#E50914" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Red Radial -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#E50914" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Letterbox Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#E50914" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#333333" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .meta-text {
      font-family: 'SF Mono', 'Courier New', 'Consolas', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      fill: #8E929B;
      text-transform: uppercase;
    }
    .cinema-red {
      fill: #FF2E3B;
      font-weight: 700;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 14px;
      fill: #FFFFFF;
      text-transform: uppercase;
      filter: drop-shadow(0 4px 16px rgba(229, 9, 20, 0.35));
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 6px;
      fill: #E2E4E9;
      text-transform: uppercase;
    }
    .sub-role {
      font-family: 'SF Mono', 'Courier New', monospace;
      font-size: 11.5px;
      letter-spacing: 3.5px;
      fill: #9E2A2B;
      font-weight: 600;
      text-transform: uppercase;
    }
    .dots {
      fill: #FF3344;
      font-size: 14px;
    }
    .frame-mark {
      stroke: #E50914;
      stroke-width: 1.5;
      stroke-opacity: 0.6;
    }
  </style>

  <!-- Cinema Card Container -->
  <rect x="2" y="2" width="956" height="316" rx="8" fill="url(#bgGrad)" stroke="#1C1F26" stroke-width="1.5"/>

  <!-- Radial Atmospheric Glow Behind Name -->
  <ellipse cx="480" cy="155" rx="340" ry="100" fill="url(#centerGlow)"/>

  <!-- Letterbox Framing Accent Lines -->
  <line x1="40" y1="26" x2="920" y2="26" stroke="url(#borderGrad)" stroke-width="1"/>
  <line x1="40" y1="294" x2="920" y2="294" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Cinema Frame Registration Corners -->
  <g class="frame-mark">
    <!-- Top-Left -->
    <path d="M 28 38 L 28 26 L 40 26"/>
    <!-- Top-Right -->
    <path d="M 932 38 L 932 26 L 920 26"/>
    <!-- Bottom-Left -->
    <path d="M 28 282 L 28 294 L 40 294"/>
    <!-- Bottom-Right -->
    <path d="M 932 282 L 932 294 L 920 294"/>
  </g>

  <!-- Top Metadata Reel Header -->
  <text x="480" y="58" text-anchor="middle" class="meta-text">
    <tspan class="cinema-red">REC ●</tspan> SCENE 01 / FRAME 24 FPS &nbsp;&nbsp;|&nbsp;&nbsp; AIML PORTFOLIO &nbsp;&nbsp;|&nbsp;&nbsp; SOUND ON
  </text>

  <!-- Main Hero Title -->
  <text x="480" y="148" text-anchor="middle" class="main-title">KAUSIQ SR</text>

  <!-- Cinematic Red Beam Separator -->
  <rect x="240" y="172" width="480" height="2" fill="url(#redGlow)" rx="1"/>
  <circle cx="480" cy="173" r="3.5" fill="#FF3344"/>

  <!-- Primary Roles -->
  <text x="480" y="214" text-anchor="middle" class="role-text">
    AI/ML ENGINEER &nbsp;<tspan class="dots">•</tspan>&nbsp; UI/UX DESIGNER &nbsp;<tspan class="dots">•</tspan>&nbsp; PROMPT ENGINEER
  </text>

  <!-- Secondary Specializations -->
  <text x="480" y="250" text-anchor="middle" class="sub-role" fill="#D63031">
    <tspan fill="#A0A5B0">LLMs</tspan> &nbsp;•&nbsp; <tspan fill="#A0A5B0">GENERATIVE AI</tspan> &nbsp;•&nbsp; <tspan fill="#A0A5B0">MACHINE LEARNING</tspan> &nbsp;•&nbsp; <tspan fill="#A0A5B0">COMPUTER VISION</tspan>
  </text>

  <!-- Bottom Strip Label -->
  <text x="480" y="280" text-anchor="middle" class="meta-text" font-size="9.5px" fill="#585D69" letter-spacing="5px">
    SRM INSTITUTE OF SCIENCE AND TECHNOLOGY — RAMAPURAM
  </text>
</svg>
