<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <!-- 1. Rich Layered Background Gradient (#030303, #080506, #120305, #1A0507, #5A080D) -->
    <linearGradient id="bgAtmosphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030303"/>
      <stop offset="20%" stop-color="#080506"/>
      <stop offset="40%" stop-color="#120305"/>
      <stop offset="50%" stop-color="#1A0507"/>
      <stop offset="60%" stop-color="#120305"/>
      <stop offset="80%" stop-color="#080506"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>

    <!-- Top & Bottom Edge Atmosphere Gradients toward #5A080D & #8B0A12 -->
    <linearGradient id="edgeGlowTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B0A12" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#5A080D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeGlowBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B0A12" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#5A080D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </linearGradient>

    <!-- Visual Light Source: Deep Red Ambient Radial Aura behind KAUSIQ SR -->
    <radialGradient id="centerAura" cx="50%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#FF1A24" stop-opacity="0.45"/>
      <stop offset="22%" stop-color="#E50914" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#8B0A12" stop-opacity="0.16"/>
      <stop offset="78%" stop-color="#1A0507" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>

    <!-- Corner Ambient Glows -->
    <radialGradient id="cornerGlowTL" cx="0%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#8B0A12" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGlowTR" cx="100%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#8B0A12" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGlowBL" cx="0%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#8B0A12" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGlowBR" cx="100%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#8B0A12" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>

    <!-- Fine Engineering Grid Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#5A080D" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="0" cy="0" r="0.75" fill="#E50914" fill-opacity="0.35"/>
    </pattern>

    <!-- Faint Horizontal Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" stroke-opacity="0.2"/>
    </pattern>

    <!-- Center Laser Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E50914" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#E50914" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Layer: Dark Core with Red Atmosphere -->
  <rect x="2" y="2" width="956" height="216" rx="8" fill="url(#bgAtmosphere)"/>
  <rect x="2" y="2" width="956" height="216" rx="8" fill="url(#techGrid)"/>
  <rect x="2" y="2" width="956" height="216" rx="8" fill="url(#scanlines)"/>

  <!-- Upper and Lower Atmospheric Glow -->
  <rect x="2" y="2" width="956" height="70" rx="8" fill="url(#edgeGlowTop)"/>
  <rect x="2" y="148" width="956" height="70" rx="8" fill="url(#edgeGlowBottom)"/>

  <!-- Corner Ambient Atmosphere -->
  <rect x="2" y="2" width="956" height="216" rx="8" fill="url(#cornerGlowTL)"/>
  <rect x="2" y="2" width="956" height="216" rx="8" fill="url(#cornerGlowTR)"/>
  <rect x="2" y="2" width="956" height="216" rx="8" fill="url(#cornerGlowBL)"/>
  <rect x="2" y="2" width="956" height="216" rx="8" fill="url(#cornerGlowBR)"/>

  <!-- Center Atmospheric Red Light Source Behind KAUSIQ SR -->
  <ellipse cx="480" cy="100" rx="430" ry="85" fill="url(#centerAura)"/>

  <!-- Circuit Traces & Glowing Red Micro-Nodes -->
  <g opacity="0.85">
    <!-- Top-left circuit -->
    <path d="M 50 20 L 130 20 L 150 35 L 260 35" fill="none" stroke="#E50914" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="50" cy="20" r="1.5" fill="#FF1A24"/>
    <circle cx="150" cy="35" r="1.2" fill="#E50914"/>
    <circle cx="260" cy="35" r="2" fill="#FF1A24"/>
    <!-- Top-right circuit -->
    <path d="M 910 20 L 830 20 L 810 35 L 700 35" fill="none" stroke="#E50914" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="910" cy="20" r="1.5" fill="#FF1A24"/>
    <circle cx="810" cy="35" r="1.2" fill="#E50914"/>
    <circle cx="700" cy="35" r="2" fill="#FF1A24"/>
    <!-- Bottom-left circuit -->
    <path d="M 50 200 L 130 200 L 150 185 L 250 185" fill="none" stroke="#E50914" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="50" cy="200" r="1.5" fill="#FF1A24"/>
    <circle cx="250" cy="185" r="2" fill="#FF1A24"/>
    <!-- Bottom-right circuit -->
    <path d="M 910 200 L 830 200 L 810 185 L 710 185" fill="none" stroke="#E50914" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="910" cy="200" r="1.5" fill="#FF1A24"/>
    <circle cx="710" cy="185" r="2" fill="#FF1A24"/>
  </g>

  <!-- Multi-Layer Illuminated Rectangular Hero Border -->
  <!-- 1. Outer Dark-Red Shadow Border -->
  <rect x="6" y="6" width="948" height="208" rx="8" fill="none" stroke="#5A080D" stroke-opacity="0.4" stroke-width="4"/>
  <!-- 2. Medium Red Border Glow -->
  <rect x="7" y="7" width="946" height="206" rx="7" fill="none" stroke="#E50914" stroke-opacity="0.35" stroke-width="2.2"/>
  <!-- 3. Sharp Precision Primary Red Border -->
  <rect x="8" y="8" width="944" height="204" rx="6" fill="none" stroke="#E50914" stroke-opacity="0.9" stroke-width="1.2"/>
  <!-- 4. Inner Subtle Red Line -->
  <rect x="12" y="12" width="936" height="196" rx="4" fill="none" stroke="#8B0A12" stroke-opacity="0.5" stroke-width="0.8"/>

  <!-- Illuminated Precision Corner Brackets & Technical Nodes -->
  <!-- Top Left Corner -->
  <path d="M 22 42 L 22 22 L 42 22" stroke="#FF1A24" stroke-width="2.5" fill="none"/>
  <circle cx="22" cy="22" r="3" fill="#FFFFFF"/>
  <circle cx="22" cy="22" r="6" fill="none" stroke="#FF1A24" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Top Right Corner -->
  <path d="M 938 42 L 938 22 L 918 22" stroke="#FF1A24" stroke-width="2.5" fill="none"/>
  <circle cx="938" cy="22" r="3" fill="#FFFFFF"/>
  <circle cx="938" cy="22" r="6" fill="none" stroke="#FF1A24" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Bottom Left Corner -->
  <path d="M 22 178 L 22 198 L 42 198" stroke="#FF1A24" stroke-width="2.5" fill="none"/>
  <circle cx="22" cy="198" r="3" fill="#FFFFFF"/>
  <circle cx="22" cy="198" r="6" fill="none" stroke="#FF1A24" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Bottom Right Corner -->
  <path d="M 938 178 L 938 198 L 918 198" stroke="#FF1A24" stroke-width="2.5" fill="none"/>
  <circle cx="938" cy="198" r="3" fill="#FFFFFF"/>
  <circle cx="938" cy="198" r="6" fill="none" stroke="#FF1A24" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Top Capsule Badge with Subtle Red Stroke -->
  <rect x="358" y="21" width="244" height="26" rx="13" fill="#0E0507" stroke="#E50914" stroke-width="1.2" stroke-opacity="0.85"/>
  <circle cx="376" cy="34" r="3" fill="#FF1A24"/>
  <circle cx="376" cy="34" r="5.5" fill="none" stroke="#FF1A24" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="487" y="38" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9.5" font-weight="700" letter-spacing="2.5" fill="#F3F4F6">
    BUILDING REAL-WORLD TECH
  </text>

  <!-- FOCAL POINT: KAUSIQ SR (Layered Technical Typography with Glow & Shadow) -->
  <!-- Layer 1: Low-Intensity Red Ambient Halo (Outer Glow) -->
  <text x="480" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif" font-weight="900" font-size="52" letter-spacing="11" fill="none" stroke="#FF1A24" stroke-width="8" stroke-linejoin="round" opacity="0.35">
    KAUSIQ SR
  </text>
  <!-- Layer 2: Medium Red Offset Shadow & Stroke Light -->
  <text x="482" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif" font-weight="900" font-size="52" letter-spacing="11" fill="#120305">
    KAUSIQ SR
  </text>
  <!-- Layer 3: Red Ambient Mid-Tone Glow -->
  <text x="480" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif" font-weight="900" font-size="52" letter-spacing="11" fill="#E50914" opacity="0.6">
    KAUSIQ SR
  </text>
  <!-- Layer 4: Bright White Core Display -->
  <text x="480" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif" font-weight="900" font-size="52" letter-spacing="11" fill="#FFFFFF">
    KAUSIQ SR
  </text>
  <!-- Layer 5: Precision Thin Red Edge Stroke -->
  <text x="480" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif" font-weight="900" font-size="52" letter-spacing="11" fill="none" stroke="#FF1A24" stroke-width="0.8" stroke-opacity="0.85">
    KAUSIQ SR
  </text>

  <!-- Technical Identity Subtitle with Red Accent & Monospace Styling -->
  <text x="480" y="135" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-weight="700" font-size="13" letter-spacing="3.5" fill="#E50914">
    AI/ML ENGINEER &#160;•&#160; UI/UX DESIGNER &#160;•&#160; PROMPT ENGINEER
  </text>

  <!-- Center Laser Divider with Pure White Center Core & Glowing Red Nodes -->
  <line x1="260" y1="148" x2="700" y2="148" stroke="url(#laserBeam)" stroke-width="1.4"/>
  <circle cx="480" cy="148" r="3.5" fill="#FFFFFF"/>
  <circle cx="480" cy="148" r="6" fill="none" stroke="#FF1A24" stroke-width="1.2"/>

  <!-- Technical Pipeline Domain Tagline -->
  <text x="480" y="176" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-weight="600" font-size="11" letter-spacing="2" fill="#D1D5DB">
    <tspan fill="#FF1A24" font-weight="800">&lt;//&gt;</tspan> LLMs &#160;•&#160; GENERATIVE AI &#160;•&#160; MACHINE LEARNING &#160;•&#160; COMPUTER VISION
  </text>
</svg>
